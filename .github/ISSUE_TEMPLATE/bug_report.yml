name: Bug report
description: Something in FluxGantt behaves incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this. A reproduction matters more than anything else below — a
        [StackBlitz](https://stackblitz.com) link, or the `tasks` / `dependencies` array plus the
        calls that trigger it, is usually enough.

        **Do not report a security vulnerability here** — use
        [private reporting](https://github.com/thai-pc/fluxgantt/security/advisories/new) instead.

  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options:
        - '@fluxgantt/core'
        - '@fluxgantt/react'
        - '@fluxgantt/vue'
        - 'not sure'
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The package version, or the commit SHA if you are running from source.
      placeholder: 0.1.0
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        A link, or the minimal code. Include the data — most scheduling and critical-path bugs
        depend on the exact task dates and dependency types.
      render: ts
    validations:
      required: true

  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      description: FluxGantt switches from SVG to Canvas above 2000 tasks.
      options:
        - 'SVG (under 2000 tasks)'
        - 'Canvas (2000+ tasks)'
        - 'both'
        - 'not applicable / not sure'

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, or the Node version for headless use.
      placeholder: Chrome 140 / Node 22.23.2

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: Stack trace, screenshot, or a note on how often it reproduces.
