name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so CI and local dev cannot drift. A bare `22` silently resolves to
          # the newest 22.x, which hid a real local breakage: `size-limit` 13 requires Node
          # >= 22.18 (it calls `fs.glob` with `withFileTypes`, added in 22.2), so on an older
          # 22.x `pnpm size` died with an opaque `TypeError: i.isFile is not a function` while
          # CI stayed green.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        # `--force` works around a pnpm 10.2.1 bug: `--frozen-lockfile` alone fails to link the
        # platform-matching `@rolldown/binding-*` native addon (a vocs 2.x/rolldown transitive
        # dependency) even though it's pinned as an explicit, lockfile-resolved optionalDependency.
        run: pnpm install --frozen-lockfile --force

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (packages + docs site + example apps)
        run: pnpm build

      - name: "Bundle size (5 gzip fixtures, budgets in packages/core/.size-limit.json)"
        run: pnpm size

      - name: Unit tests
        run: pnpm test

      - name: Snippet-sync check (README / docs / example stay identical)
        run: node tooling/scripts/check-snippet-sync.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1

      - uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so CI and local dev cannot drift. A bare `22` silently resolves to
          # the newest 22.x, which hid a real local breakage: `size-limit` 13 requires Node
          # >= 22.18 (it calls `fs.glob` with `withFileTypes`, added in 22.2), so on an older
          # 22.x `pnpm size` died with an opaque `TypeError: i.isFile is not a function` while
          # CI stayed green.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        # See the `build` job's Install step for why `--force` is needed here too.
        run: pnpm install --frozen-lockfile --force

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        # `webkit` added for spec-canvas-webkit-dimension-limit.md's new
        # `webkit-canvas-dimension-guard` project (§12.2).
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: e2e (drives examples/plain-html-demo via Playwright webServer)
        run: pnpm test:e2e

      - name: "WebKit canvas area-dimension guard (spec-canvas-webkit-dimension-limit.md §12.2)"
        # NOTE: each `pnpm test:*` script is scoped to its own `--project=`, unlike a bare
        # `playwright test` (which would run every configured project by default) — this repo's
        # `test:e2e` only ever ran the `e2e` project, so the new `webkit-canvas-dimension-guard`
        # project needs its own explicit script + CI step, not just an installed browser binary.
        run: pnpm test:webkit-canvas-dimension-guard

# NOTE: This workflow build-checks the docs site and example apps (per the locked decision:
# "CI build-check, deploy later"). A live deploy (e.g. Vercel/GitHub Pages) needs an external
# account/token and is intentionally NOT wired here — that is a repo-owner follow-up. See
# apps/docs/README.md for the ready-to-use deploy config.
