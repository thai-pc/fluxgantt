name: Release

on:
  push:
    branches: [master]

concurrency:
  # Serialise releases: two overlapping runs would both try to open/update the same
  # "Version Packages" PR and race on tags.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # commit version bumps + push tags
  pull-requests: write # open/update the "Version Packages" PR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # changesets diffs against the base branch to decide what changed, so it needs real
          # history — the default shallow clone makes `changeset version` misbehave.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.2.1

      - uses: actions/setup-node@v7
        with:
          # Same reasoning as ci.yml: read the pinned version from .nvmrc so CI and local dev
          # cannot drift.
          node-version-file: .nvmrc
          cache: pnpm
          # REQUIRED for the publish to authenticate, and easy to omit because nothing fails
          # loudly without it. `changesets/action` v2 removed its own `.npmrc` handling (its
          # changelog points at Trusted Publishing, or at this option); `setup-node` writes the
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` line ONLY when `registry-url`
          # is set (actions/setup-node src/authutil.ts gates `configAuthentication` on it). With
          # neither, NODE_AUTH_TOKEN below sits in the environment with no reader and
          # `pnpm publish` fails ENEEDAUTH.
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        # See ci.yml's Install step: `--force` works around a pnpm 10.2.1 bug where
        # `--frozen-lockfile` alone fails to link the platform-matching `@rolldown/binding-*`
        # native addon.
        run: pnpm install --frozen-lockfile --force

      - name: Build packages (so the readiness check can resolve every exports target)
        # The gate below asserts each `exports`/`main`/`types` target exists on disk, which is the
        # only way to catch a broken exports map — a workspace resolves by symlink, never through
        # `exports`. `dist/` is gitignored, so on a fresh checkout that assertion fails on all six
        # subpaths unless something builds first. Cheap: turbo caches, and `pnpm release` rebuilds
        # inside the changesets step anyway, so the publish still cannot ship a stale dist.
        run: pnpm build

      - name: Publish readiness (npm metadata + every exports target resolves)
        run: node tooling/scripts/check-publish-readiness.mjs

      - name: Changesets — open the "Version Packages" PR, or publish an already-versioned commit
        # Pinned to an exact tag, not `@v2`: upstream has no `refs/tags/v2`, only a mutable
        # `refs/heads/v2` BRANCH (`git ls-remote` shows the branch and tags v2.0.0..v2.1.2, no
        # bare v2 tag). The usual "float on the major" convention does not apply when the `vN`
        # ref is a branch someone can force-push.
        uses: changesets/action@v2.1.2
        with:
          # `release` = `turbo run build && changeset publish` (root package.json). Building here
          # rather than in a prior step keeps the artefacts and the publish in one invocation, so
          # nothing can publish a stale dist.
          # v2 renamed every one of these inputs (publish -> publish-script,
          # version -> version-script, commit -> commit-message, title -> pr-title). The old
          # names are silently ignored rather than rejected, so a v2 bump that keeps them looks
          # green and then opens a PR titled "Version Packages" with no version script run.
          publish-script: pnpm release
          version-script: pnpm version-packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          # v2 no longer accepts the token through the GITHUB_TOKEN env var: it must be passed
          # explicitly to this input, and credentials configured by actions/checkout are not a
          # substitute.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_FLUXGRANTT }}
          # changesets spawns `pnpm publish` and builds only --access/--tag/--no-git-checks; it
          # never passes --provenance (verified against @changesets/cli's source). The env var is
          # the only way to get provenance on this path, and it requires `id-token: write` above
          # plus a registry that accepts it — left off until it can be verified end to end.
          NPM_CONFIG_PROVENANCE: 'false'
